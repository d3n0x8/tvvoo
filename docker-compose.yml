services:
  tvvoo:
    build: .
    container_name: tvvoo
    restart: unless-stopped
    environment:
      - PORT=7019
    networks:
      - mediaflow-proxy_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=mediaflow-proxy_default
      - traefik.http.routers.tvvoo.rule=Host(`tvvoo.ledoque.com`)
      - traefik.http.routers.tvvoo.entrypoints=websecure
      - traefik.http.routers.tvvoo.tls.certresolver=myresolver
      - traefik.http.services.tvvoo.loadbalancer.server.port=7019

networks:
  mediaflow-proxy_default:
    external: true
