services:
  tvvoo:
    build: .
    container_name: tvvoo
    restart: unless-stopped
    environment:
      - PORT=7019
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.tvvoo.rule=Host(`tvvoo.ton-domaine.fr`)
      - traefik.http.routers.tvvoo.entrypoints=websecure
      - traefik.http.routers.tvvoo.tls.certresolver=letsencrypt
      - traefik.http.services.tvvoo.loadbalancer.server.port=7019

networks:
  proxy:
    external: true
